services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  ui:
    build: .
    command: chainlit run app/ui.py --host 0.0.0.0 --port 8001
    environment:
      API_URL: http://api:8000
      DATABASE_URL: ""        # ← Chainlit 데이터 레이어 비활성화
    depends_on:
      - api
    ports:
      - "8001:8001"
    volumes:
      - .:/app
